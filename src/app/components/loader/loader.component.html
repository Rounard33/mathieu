@if (isVisible()) {
  <div class="loader-overlay" [class.fade-out]="!isVisible()">
    <div class="loader-content">
      <div class="loader-logo">
        <div class="logo-container">
          <div class="logo-hex">
            <svg viewBox="0 0 44 50" width="80" height="90">
              <polygon 
                points="22,0 44,12.7 44,38.2 22,50 0,38.2 0,12.7" 
                fill="none" 
                stroke="currentColor" 
                stroke-width="1.5"
                class="hex-outer"
              />
              <polygon 
                points="22,8 34,15.6 34,34.4 22,42 10,34.4 10,15.6" 
                fill="currentColor"
                opacity="0.3"
                class="hex-inner"
              />
            </svg>
          </div>
          <span class="logo-text">PIXEL</span>
        </div>
      </div>
      <div class="loader-spinner">
        <div class="spinner-dot"></div>
        <div class="spinner-dot"></div>
        <div class="spinner-dot"></div>
      </div>
    </div>
  </div>
}
